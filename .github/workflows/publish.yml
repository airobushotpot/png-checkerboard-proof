name: Publish Docker image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check release tag and public Docker Hub repository
        id: release
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Start this workflow from a version tag such as v0.1.0." >&2
            exit 1
          fi
          if [[ ! "$DOCKERHUB_USERNAME" =~ ^[a-z0-9]+$ ]]; then
            echo "Set the DOCKERHUB_USERNAME repository variable." >&2
            exit 1
          fi
          image="$DOCKERHUB_USERNAME/png-checkerboard-proof"
          version="${GITHUB_REF_NAME#v}"
          repo_url="https://hub.docker.com/v2/namespaces/$DOCKERHUB_USERNAME/repositories/png-checkerboard-proof"
          curl --silent --show-error --fail "$repo_url" |
            jq -e '.is_private == false and (.full_description | contains("https://seedream55pro.com/image/transparent-background-generator"))' >/dev/null
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$repo_url/tags/$version")"
          if [[ "$status" != 404 ]]; then
            echo "Expected an unused version tag, got HTTP $status." >&2
            exit 1
          fi
          echo "image=docker.io/$image:$version" >> "$GITHUB_OUTPUT"

      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Sign in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Package and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image }}
